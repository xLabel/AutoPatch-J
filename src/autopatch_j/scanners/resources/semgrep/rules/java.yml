rules:
  # --- 1. 安全加固 (Security) ---
  - id: autopatch-j.java.security.weak-crypto-md5
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance("MD5")
          - pattern: MessageDigest.getInstance("md5")
    message: 检测到使用 MD5 弱哈希算法。建议升级为 SHA-256。
    languages: [java]
    severity: ERROR
    metadata:
      cwe: CWE-327

  - id: autopatch-j.java.security.insecure-random
    patterns:
      - pattern-either:
          - pattern: new java.util.Random(...)
          - pattern: new Random(...)
    message: 使用了可预测的 Random；仅当用于令牌、密钥等安全敏感用途时考虑 SecureRandom。模拟、采样和可复现随机序列不能据此直接判错。
    languages: [java]
    severity: WARNING
    metadata:
      cwe: CWE-338

  # --- 2. 健壮性与正确性 (Correctness & Robustness) ---
  - id: autopatch-j.java.correctness.optional-get-without-check
    patterns:
      - pattern: (java.util.Optional $OPT).get()
      - pattern-not-inside: if ($OPT.isPresent()) { ... }
    message: Optional.get() 未在直接的 isPresent() 分支中；空 Optional 会抛 NoSuchElementException。需核查调用前置条件和其他保护，不能直接认定缺陷。
    languages: [java]
    severity: ERROR

  - id: autopatch-j.java.correctness.unsafe-equals-order
    patterns:
      - pattern: $X.equals($STR)
      - metavariable-regex:
          metavariable: $STR
          regex: '^".+"$'
      - pattern-not: ("...").equals(...)
    message: 检测到潜在的空指针异常风险。建议将常量移至 equals() 的左侧以确保安全。
    languages: [java]
    severity: WARNING

  # --- 3. 资源管理 (Resource Management) ---
  - id: autopatch-j.java.resources.unclosed-io-stream
    patterns:
      - pattern-either:
          - pattern: $TYPE $S = new FileInputStream(...);
          - pattern: $TYPE $S = new FileOutputStream(...);
      - pattern-not-inside: |
          try ($TYPE $S = ...) { ... }
      - pattern-not-inside: |
          try ($S) { ... }
    message: 检测到 IO 流未通过 Try-with-resources 自动关闭。
    languages: [java]
    severity: WARNING

  # --- 4. 编码规范 (Best Practices) ---
  - id: autopatch-j.java.best-practice.missing-constructor-null-check
    patterns:
      - pattern: |
          public $CLASS(..., $TYPE $VAR, ...) {
            ...
            this.$FIELD = $VAR;
            ...
          }
      - pattern-not: |
          public $CLASS(..., $TYPE $VAR, ...) {
            ...
            if ($VAR == null) { ... }
            ...
            this.$FIELD = $VAR;
            ...
          }
      - pattern-not: |
          public $CLASS(..., $TYPE $VAR, ...) {
            ...
            this.$FIELD = Objects.requireNonNull($VAR, ...);
            ...
          }
    message: 构造参数直接赋给字段；需核查该参数是否允许 null 以及已有调用契约。允许为空时无需添加拒绝逻辑，不能仅因缺少检查认定缺陷。
    languages: [java]
    severity: WARNING
