<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title description">
  <title id="title">AutoPatch-J 持续代码修复愿景</title>
  <desc id="description">演进规划：代码变更通过现有 CI/CD 触发 AutoPatch-J，Agent 结合项目规范与长期项目记忆，完成代码取证、缺陷判断、补丁生成和验证，将修复以 MR 或 PR 交付人工评审。验证结果和评审意见用于继续修订；通过语言与扫描工具扩展支持更多工程场景。</desc>

  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.021" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M3 2 Q8 5 13 8 Q8 11 3 14" fill="none" stroke="#303338" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="accent-arrow" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M3 2 Q8 5 13 8 Q8 11 3 14" fill="none" stroke="#13795f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .canvas { fill: #f5f6f7; }
    .text {
      fill: #24272b;
      font-family: "HanziPen SC", "Hannotate SC", "Kaiti SC", "STKaiti", "KaiTi", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 32px;
      font-weight: 600;
    }
    .title { font-size: 44px; }
    .brand { font-size: 46px; }
    .small { font-size: 27px; }
    .stage-text { font-size: 28px; }
    .accent-text { fill: #0c684f; }
    .panel {
      fill: #f5f6f7;
      stroke: #303338;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .core { fill: #edf5f1; stroke: #13795f; stroke-width: 3; }
    .stage { stroke: #13795f; stroke-width: 2.2; }
    .line {
      fill: none;
      stroke: #303338;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      marker-end: url(#arrow);
    }
    .accent-line { stroke: #13795f; stroke-width: 3; marker-end: url(#accent-arrow); }
    .dashed { stroke-dasharray: 9 9; }
    .rough { filter: url(#rough); }

    @media (prefers-color-scheme: dark) {
      .canvas, .panel { fill: #181b20; }
      .text { fill: #f1eee7; }
      .accent-text { fill: #8ce0c7; }
      .panel { stroke: #d9d5cc; }
      .core { fill: #172c27; stroke: #63c9ac; }
      .stage { stroke: #63c9ac; }
      .line { stroke: #d9d5cc; }
      .accent-line { stroke: #63c9ac; }
      #arrow path { stroke: #d9d5cc; }
      #accent-arrow path { stroke: #63c9ac; }
    }
  </style>

  <rect class="canvas" width="1600" height="1100" rx="18"/>
  <text class="text title" x="800" y="80" text-anchor="middle">Agent 驱动的持续代码修复</text>
  <path class="panel rough" d="M1330 38 Q1429 34 1532 40 L1534 93 Q1431 98 1328 92 Z"/>
  <text class="text small" x="1430" y="76" text-anchor="middle">演进规划</text>

  <!-- Project knowledge supports the Agent, independently of pipeline triggers. -->
  <path class="panel rough" d="M494 185 Q800 178 1107 186 L1110 300 Q799 307 491 299 Z"/>
  <text class="text" x="800" y="231" text-anchor="middle">项目知识</text>
  <text class="text" x="800" y="278" text-anchor="middle">项目规范 · 长期项目记忆</text>
  <path class="line dashed" d="M800 310 Q796 340 800 373"/>

  <!-- The existing delivery pipeline is an entry point, not a replacement platform. -->
  <path class="panel rough" d="M68 421 Q208 415 347 422 L351 665 Q208 672 65 663 Z"/>
  <text class="text" x="208" y="471" text-anchor="middle">工程入口</text>
  <text class="text" x="208" y="541" text-anchor="middle">代码变更</text>
  <text class="text" x="208" y="602" text-anchor="middle">现有 CI/CD</text>
  <path class="line accent-line" d="M360 550 Q396 545 435 550"/>
  <text class="text small" x="398" y="525" text-anchor="middle">触发</text>

  <!-- AutoPatch-J is the visual center: investigation, judgment, patch and verification. -->
  <path class="panel core rough" d="M451 387 Q799 378 1148 387 L1154 715 Q800 723 447 714 Z"/>
  <text class="text brand accent-text" x="800" y="459" text-anchor="middle">AutoPatch-J</text>

  <path class="panel stage rough" d="M477 525 Q540 522 603 526 L606 599 Q540 604 475 599 Z"/>
  <text class="text stage-text" x="540" y="572" text-anchor="middle">代码取证</text>
  <path class="line accent-line" d="M614 563 Q624 560 636 563"/>

  <path class="panel stage rough" d="M647 525 Q710 521 773 526 L776 599 Q710 604 645 599 Z"/>
  <text class="text stage-text" x="710" y="572" text-anchor="middle">缺陷判断</text>
  <path class="line accent-line" d="M784 563 Q794 566 806 563"/>

  <path class="panel stage rough" d="M817 525 Q880 522 943 526 L946 599 Q880 604 815 599 Z"/>
  <text class="text stage-text" x="880" y="572" text-anchor="middle">补丁生成</text>
  <path class="line accent-line" d="M954 563 Q964 560 976 563"/>

  <path class="panel stage rough" d="M987 525 Q1050 521 1113 526 L1116 599 Q1050 604 985 599 Z"/>
  <text class="text stage-text" x="1050" y="572" text-anchor="middle">补丁验证</text>

  <path class="line accent-line" d="M1050 609 L1050 638 Q1051 660 1027 660 L563 660 Q540 660 540 637 L540 609"/>
  <text class="text small accent-text" x="800" y="643" text-anchor="middle">验证反馈 · 继续修订</text>

  <!-- Repairs are delivered for human review; no unattended merge is implied. -->
  <path class="line accent-line" d="M1163 550 Q1199 545 1234 550"/>
  <path class="panel rough" d="M1248 421 Q1389 415 1530 422 L1534 665 Q1389 672 1245 663 Z"/>
  <text class="text" x="1390" y="471" text-anchor="middle">协作交付</text>
  <text class="text accent-text" x="1390" y="530" text-anchor="middle">MR / PR</text>
  <text class="text" x="1390" y="581" text-anchor="middle">人工评审</text>
  <text class="text small" x="1390" y="632" text-anchor="middle">合并 / 修订</text>

  <path class="line accent-line dashed" d="M1390 678 L1390 773 Q1391 804 1359 804 L1071 804 Q1040 805 1040 774 L1040 725"/>
  <text class="text small accent-text" x="1230" y="783" text-anchor="middle">评审反馈</text>

  <!-- Language and scanner integrations extend the same repair capabilities. -->
  <path class="panel rough" d="M368 901 Q800 893 1230 902 L1234 1045 Q800 1052 365 1044 Z"/>
  <text class="text" x="800" y="947" text-anchor="middle">语言与工具扩展</text>
  <text class="text" x="580" y="1008" text-anchor="middle">多语言源码</text>
  <text class="text" x="1010" y="1008" text-anchor="middle">多种静态分析工具</text>
  <path class="line dashed" d="M560 891 Q554 817 560 725"/>
  <text class="text small" x="580" y="817">按需接入</text>
</svg>
