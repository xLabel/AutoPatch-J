<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1080" role="img" aria-labelledby="title description">
  <title id="title">AutoPatch-J 架构与职责分工</title>
  <desc id="description">用户目标、项目知识与会话进展支持Agent。Agent 结合源码取证与静态扫描准备修复提案，经人工审核后由程序校验并应用。审核修订返回 Agent，写入事实与验证反馈在后续交互中参与判断。</desc>

  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.021" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M3 2 Q8 5 13 8 Q8 11 3 14" fill="none" stroke="#303338" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="accent-arrow" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M3 2 Q8 5 13 8 Q8 11 3 14" fill="none" stroke="#13795f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .canvas { fill: #f5f6f7; }
    .text {
      fill: #24272b;
      font-family: "HanziPen SC", "Hannotate SC", "Kaiti SC", "STKaiti", "KaiTi", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 32px;
      font-weight: 600;
    }
    .small { font-size: 27px; }
    .accent-text { fill: #0c684f; }
    .panel {
      fill: #f5f6f7;
      fill-opacity: 0.68;
      stroke: #303338;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .accent-panel { stroke: #13795f; stroke-width: 3; }
    .arrow-line {
      fill: none;
      stroke: #303338;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      marker-end: url(#arrow);
    }
    .two-way { marker-start: url(#arrow); }
    .accent-arrow-line { stroke: #13795f; stroke-width: 3; marker-end: url(#accent-arrow); }
    .feedback { stroke-dasharray: 9 9; }
    .rough { filter: url(#rough); }

    @media (prefers-color-scheme: dark) {
      .canvas { fill: #181b20; }
      .text { fill: #f1eee7; }
      .accent-text { fill: #8ce0c7; }
      .panel { fill: #181b20; stroke: #d9d5cc; }
      .accent-panel { stroke: #63c9ac; }
      .arrow-line { stroke: #d9d5cc; }
      .accent-arrow-line { stroke: #63c9ac; }
      #arrow path { stroke: #d9d5cc; }
      #accent-arrow path { stroke: #63c9ac; }
    }
  </style>

  <rect class="canvas" width="1400" height="1080" rx="18"/>

  <!-- Inputs, project knowledge and persistent conversation -->
  <path class="panel rough" d="M63 62 Q249 57 447 63 L450 177 Q260 184 62 178 Z"/>
  <text class="text" x="255" y="110" text-anchor="middle">用户目标、当前要求</text>
  <text class="text" x="255" y="150" text-anchor="middle">与任务事实</text>
  <path class="panel rough" d="M512 62 Q699 57 887 64 L891 179 Q699 184 511 177 Z"/>
  <text class="text" x="700" y="133" text-anchor="middle">项目规范与长期知识</text>
  <path class="panel rough" d="M942 63 Q1140 56 1338 64 L1340 177 Q1141 184 941 179 Z"/>
  <text class="text" x="1140" y="133" text-anchor="middle">会话进展</text>

  <path class="arrow-line" d="M255 184 Q251 230 293 230 L590 230 Q602 231 600 275"/>
  <path class="arrow-line" d="M700 185 Q695 224 701 272"/>
  <path class="arrow-line two-way" d="M1140 185 L1140 313 Q1142 345 1109 345 L898 345"/>

  <!-- Agent and source investigation -->
  <path class="panel accent-panel rough" d="M513 281 Q701 275 886 282 L890 407 Q701 416 511 408 Z"/>
  <text class="text accent-text" x="700" y="359" text-anchor="middle">Agent</text>
  <path class="panel rough" d="M62 501 Q230 495 398 503 L401 598 Q230 606 61 599 Z"/>
  <text class="text" x="230" y="562" text-anchor="middle">源码取证与静态扫描</text>
  <path class="arrow-line two-way" d="M503 345 L264 345 Q229 343 230 378 L230 492"/>

  <!-- Proposed patch, human review and controlled application -->
  <path class="arrow-line accent-arrow-line" d="M700 419 Q695 455 700 491"/>
  <path class="panel rough" d="M513 502 Q701 496 886 502 L891 599 Q699 606 511 599 Z"/>
  <text class="text" x="700" y="562" text-anchor="middle">修复提案与语法检查</text>
  <path class="arrow-line accent-arrow-line" d="M700 609 Q706 648 700 690"/>
  <path class="panel rough" d="M512 702 Q699 695 887 702 L890 798 Q700 806 511 799 Z"/>
  <text class="text" x="700" y="762" text-anchor="middle">人工审核</text>
  <path class="arrow-line" d="M503 750 L468 750 Q438 750 440 720 L440 423 Q439 391 470 392 L503 392"/>
  <text class="text small" x="422" y="668" text-anchor="end">修订</text>
  <path class="arrow-line accent-arrow-line" d="M700 810 Q695 848 700 890"/>
  <text class="text small accent-text" x="724" y="859">批准</text>
  <path class="panel accent-panel rough" d="M513 902 Q701 895 886 902 L890 998 Q700 1007 511 999 Z"/>
  <text class="text accent-text" x="700" y="962" text-anchor="middle">基线校验与源码应用</text>

  <!-- Real execution facts return only in subsequent interactions -->
  <path class="arrow-line accent-arrow-line" d="M899 950 Q930 945 962 950"/>
  <path class="panel rough" d="M973 902 Q1151 896 1327 903 L1331 998 Q1150 1005 971 999 Z"/>
  <text class="text" x="1150" y="962" text-anchor="middle">写入事实与验证反馈</text>
  <path class="arrow-line feedback" d="M1150 892 L1150 473 Q1151 440 1117 440 L855 440 Q830 441 830 419"/>
  <text class="text small" x="1172" y="661">后续交互</text>
  <text class="text small" x="1172" y="699">参与判断</text>
</svg>
