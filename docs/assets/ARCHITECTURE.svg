<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-labelledby="title description">
  <title id="title">AutoPatch-J 技术架构</title>
  <desc id="description">CLI 接入 Agent；LLM 推理决策，Harness 调度工具并回传结果。上下文与长期记忆提供任务所需信息，长期记忆通过渐进式披露分层读取。人工评审与应用验证控制源码写入，执行结果在后续对话中提供；会话、记忆内容、任务与提案分别保存。</desc>
  <defs>
    <filter id="rough" x="-3%" y="-5%" width="106%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.021" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 Q7 4 12 7 Q7 10 2 12"/></marker>
    <marker id="approval-arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 Q7 4 12 7 Q7 10 2 12"/></marker>
  </defs>
  <style>
    .canvas { fill:#f5f6f7; }
    text { fill:#24272b; font-family:"HanziPen SC","Hannotate SC","Kaiti SC","STKaiti","KaiTi","PingFang SC","Microsoft YaHei",sans-serif; font-size:32px; font-weight:600; }
    .title { font-size:43px; } .heading { font-size:34px; } .small { font-size:28px; } .tiny { font-size:26px; } .brand { font-size:40px; }
    .muted { fill:#545b63; }
    .panel { fill:#f5f6f7; stroke:#737b84; stroke-width:2.3; stroke-linejoin:round; filter:url(#rough); }
    .blue { fill:#edf3fc; stroke:#3869a4; } .blue-text { fill:#24588f; }
    .purple { fill:#f3eff9; stroke:#8661aa; } .purple-text { fill:#704390; }
    .orange { fill:#fbf1e6; stroke:#b46b24; } .orange-text { fill:#935111; }
    .line { fill:none; stroke:#737b84; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
    .approval { stroke:#b46b24; marker-end:url(#approval-arrow); } .dashed { stroke-dasharray:8 7; }
    #arrow path { fill:none; stroke:#737b84; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    #approval-arrow path { fill:none; stroke:#b46b24; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    @media(prefers-color-scheme:dark) {
      .canvas,.panel { fill:#181b20; } text { fill:#f1eee7; } .muted { fill:#b4bcc5; }
      .panel { stroke:#a8afb8; } .blue { fill:#192b40; stroke:#8bb5e7; } .blue-text { fill:#a4c8f2; }
      .purple { fill:#2b223b; stroke:#b99bd9; } .purple-text { fill:#d1b7ed; }
      .orange { fill:#36291c; stroke:#e1a266; } .orange-text { fill:#f1bb84; }
      .line,#arrow path { stroke:#a8afb8; } .approval,#approval-arrow path { stroke:#e1a266; }
    }
  </style>
  <rect class="canvas" width="1600" height="1040" rx="18"/>
  <text x="40" y="61" text-anchor="start" class="title">AutoPatch-J 技术架构</text>
